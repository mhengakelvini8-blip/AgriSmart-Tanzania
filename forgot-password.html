<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | AgriSmart Tanzania</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <div class="auth-logo">
                🔑
            </div>

            <div class="lang-switch">
                <button type="button" data-lang-btn="en">EN</button>
                <button type="button" data-lang-btn="sw">SW</button>
            </div>

            <h1>AgriSmart Tanzania</h1>

            <h2 data-i18n="forgot_heading">Reset Your Password</h2>

            <p class="auth-description" data-i18n="forgot_desc">
                Enter the email linked to your account. If the account exists, a reset code will be sent to that email address.
            </p>

            <!-- STEP 1: REQUEST A CODE -->

            <form id="requestCodeForm">

                <label for="accountType" id="accountTypeLabel" data-i18n="label_account_type">
                    Account Type
                </label>

                <select id="accountType">
                    <option value="farmer" data-i18n="option_farmer">Farmer</option>
                    <option value="admin" data-i18n="option_admin">Admin</option>
                </select>

                <label for="resetEmail" data-i18n="label_email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="resetEmail"
                    placeholder="you@example.com"
                    required
                >

                <button type="submit" class="auth-button" data-i18n="btn_send_code">
                    Send Reset Code
                </button>

            </form>

            <p id="requestMessage"></p>

            <!-- STEP 2: ENTER CODE + NEW PASSWORD (hidden until step 1 succeeds) -->

            <form id="resetForm" style="display: none;">

                <label for="resetCode" data-i18n="label_reset_code">
                    Reset Code
                </label>

                <input
                    type="text"
                    id="resetCode"
                    placeholder="6-digit code"
                    required
                >

                <label for="newPassword" data-i18n="label_new_password">
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Create a new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="toggleNewPassword">
                        👁️
                    </button>

                </div>

                <button type="submit" class="auth-button" data-i18n="btn_reset_password">
                    Reset Password
                </button>

            </form>

            <p id="resetMessage"></p>

            <p class="auth-footer">
                <a href="login.html" id="backToLoginLink" data-i18n="back_to_login">
                    ← Back to Login
                </a>
            </p>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/language.js"></script>
    <script src="js/script.js"></script>

    <script>

        // ========================================
        // FORGOT PASSWORD PAGE
        // ========================================

        // API_BASE comes from js/config.js (loaded in <head> below).

        const accountType = document.getElementById("accountType");
        const backToLoginLink = document.getElementById("backToLoginLink");

        // If linked as forgot-password.html?role=admin, lock it to admin.
        const params = new URLSearchParams(window.location.search);

        if (params.get("role") === "admin") {

            accountType.value = "admin";
            document.getElementById("accountTypeLabel").style.display = "none";
            accountType.style.display = "none";
            backToLoginLink.textContent = "← Back to Admin Login";
            backToLoginLink.dataset.i18n = "back_to_admin_login";
            backToLoginLink.href = "admin-login.html";

        }

        let resettingEmail = "";

        const requestCodeForm = document.getElementById("requestCodeForm");
        const requestMessage = document.getElementById("requestMessage");
        const resetForm = document.getElementById("resetForm");
        const resetMessage = document.getElementById("resetMessage");

        requestCodeForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const email = document.getElementById("resetEmail").value.trim();
            const role = accountType.value;

            requestMessage.textContent = t("msg_requesting_code");

            try {

                const response = await fetch(API_BASE + "/api/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, role })
                });

                const data = await response.json();

                if (!response.ok) {
                    requestMessage.textContent = data.message ? tServer(data.message) : t("msg_unable_request_code");
                    return;
                }

                resettingEmail = email;

                requestMessage.textContent = data.message || "If an account exists for that email, a reset code has been sent.";
                // In local development the API returns a code for testing. Never render it in production.
                if (data.code && (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")) {
                    requestMessage.textContent += " Development code: " + data.code;
                }
                resetForm.style.display = "block";

            } catch (error) {

                requestMessage.textContent = t("msg_connect_error");

            }

        });

        resetForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            const code = document.getElementById("resetCode").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const role = accountType.value;

            resetMessage.textContent = t("msg_resetting");

            try {

                const response = await fetch(API_BASE + "/api/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: resettingEmail, role, code, newPassword })
                });

                const data = await response.json();

                if (!response.ok) {
                    resetMessage.textContent = data.message ? tServer(data.message) : t("msg_unable_reset");
                    return;
                }

                resetMessage.textContent = tServer(data.message) + " " + t("msg_redirecting_login");

                setTimeout(function () {
                    window.location.href = role === "admin" ? "admin-login.html" : "login.html";
                }, 1200);

            } catch (error) {

                resetMessage.textContent = t("msg_connect_error");

            }

        });

    </script>

</body>

</html>
