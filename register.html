<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AgriSmart Tanzania</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <div class="auth-logo">
                🌾
            </div>

            <div class="lang-switch">
                <button type="button" data-lang-btn="en">EN</button>
                <button type="button" data-lang-btn="sw">SW</button>
            </div>

            <h1>AgriSmart Tanzania</h1>

            <h2 data-i18n="register_heading">Create Your Farmer Account</h2>

            <p class="auth-description" data-i18n="register_desc">
                Register to access agricultural information
                and smart farming services.
            </p>

            <form id="registerForm">

                <!-- FARM NAME -->

                <label for="farmName" data-i18n="label_farmname">
                    Farm Name / Username
                </label>

                <input
                    type="text"
                    id="farmName"
                    data-i18n-placeholder="placeholder_farmname"
                    placeholder="Enter farm name or username"
                    minlength="3"
                    required
                >

                <!-- REGION -->

                <label for="region" data-i18n="label_region">
                    Select Your Region
                </label>

                <select id="region" data-region-select required>
                </select>

                <!-- EMAIL -->

                <label for="email" data-i18n="label_email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

                <small class="password-hint" data-i18n="email_hint">
                    Used only for account recovery (forgot password).
                </small>

                <!-- PASSWORD -->

                <label for="password" data-i18n="label_password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword">
                        👁️
                    </button>

                </div>

                <small class="password-hint" data-i18n="password_hint">
                    Password must contain at least 6 characters.
                </small>

                <!-- CONFIRM PASSWORD -->

                <label for="confirmPassword" data-i18n="label_confirm_password">
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="toggleConfirmPassword">
                        👁️
                    </button>

                </div>

                <!-- SUBMIT -->

                <button type="submit" class="auth-button" data-i18n="btn_create_account">
                    Create Account
                </button>

            </form>

            <p id="registerMessage"></p>

            <p class="auth-footer">
                <span data-i18n="already_have_account">Already have an account?</span>
                <a href="login.html" data-i18n="login_here">Login here</a>
            </p>

            <a href="index.html" class="back-home" data-i18n="back_home">
                ← Back to Homepage
            </a>

        </div>

    </div>

    <script src="js/regions.js"></script>
    <script src="js/language.js"></script>
    <script src="js/script.js"></script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
